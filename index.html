<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<meta name="description" content="বাংলায় জনপ্রিয় AI মডেল ও অ্যাপ খুঁজুন।">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./app-icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI Model Hub">
<title>AI MODEL HUB – মডেল ও অ্যাপ</title>
<style>
:root{--bg:#f6f8fc;--tx:#182235;--card:#fff;--bd:#e5eaf2;--accent:#526ee8;--accent-soft:#edf0ff;--muted:#6b778c;--green:#e8f7ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;line-height:1.65}
.w{max-width:1080px;margin:auto;padding:0 22px 48px}
header{margin:28px 0 22px;background:var(--card);color:var(--tx);padding:26px 28px;border:1px solid var(--bd);border-radius:20px;box-shadow:0 5px 20px #17233a0a}
h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:-1.4px;line-height:1.2;font-weight:750}
header p{margin:9px 0 0;color:var(--muted);font-weight:400}
input{width:100%;padding:14px 16px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;box-shadow:0 2px 8px #17233a08;margin-bottom:16px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #526ee81c}
.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}
.tab{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--muted);padding:9px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
.tab.on{background:var(--accent-soft);border-color:#d8defe;color:var(--accent)}
.tab:hover{border-color:#b8c4f5;color:var(--accent)}
#installBtn{background:var(--accent)!important;color:#fff!important;border:0}
h2{font-size:21px;font-weight:700;letter-spacing:-.3px;margin:28px 0 14px;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.card{border:1px solid var(--bd);border-radius:16px;background:var(--card);box-shadow:0 3px 12px #17233a08;padding:18px;display:flex;flex-direction:column;gap:9px;transition:transform .16s,box-shadow .16s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #17233a10}
.card h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px}
.by{font-size:13px;font-weight:500;color:var(--muted)}
.tags span{display:inline-block;border:1px solid #e5eaf2;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin:0 5px 3px 0;background:#f3f5fa;color:#536078}
.tags span.o{background:var(--green);border-color:#d7efdf;color:#28744b}
.tags span.a{background:var(--accent-soft);border-color:#e0e5ff;color:#5265bf}
.card p{margin:0;font-size:14px;line-height:1.7;color:#526078;flex:1}
.go{display:block;text-align:center;text-decoration:none;font-weight:650;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:9px;padding:9px 12px;transition:background .15s}
.go:hover{background:#405bd0}
.go:active{transform:translateY(1px)}
.empty{border:1px dashed #cbd3e1;border-radius:14px;padding:24px;font-weight:600;text-align:center;color:var(--muted);background:#fff}
footer{margin-top:34px;border-top:1px solid var(--bd);padding:18px 2px;font-size:13px;color:var(--muted)}
@media(max-width:560px){.w{padding:0 15px 32px}header{margin:16px 0;padding:21px 18px;border-radius:16px}.grid{grid-template-columns:1fr}.card{padding:16px}h2{font-size:19px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="w">
<header><h1>AI Model Hub</h1><p>মডেল ও এআই অ্যাপ — এক জায়গায়। কার্ডের বাটনে চাপ দিলেই সরাসরি খুলবে।</p>
<button id="installBtn" class="tab" type="button" hidden style="margin-top:14px">⬇ অ্যাপ ইনস্টল করুন</button>
<p id="installHelp" aria-live="polite" style="font-size:13px;margin-top:8px"></p></header>
<input id="q" type="search" placeholder="খুঁজুন: Claude, ছবি, কোড…" aria-label="খুঁজুন">
<div class="tabs" id="tabs"></div>
<div id="out"></div>
<footer>⚠ লিংকগুলো প্রতিটি কোম্পানির অফিসিয়াল সাইটে যায়। কিছু সেবা সাইন-আপ বা পেমেন্ট চাইতে পারে। তথ্য সাধারণ ধারণাভিত্তিক।</footer>
</div>
<script>
// [নাম, কোম্পানি, টাইপ, লাইসেন্স/ধরন, বিবরণ, লিংক]
const MODELS=[
["GPT","OpenAI","টেক্সট","ক্লোজড","চ্যাট, কোড ও বিশ্লেষণে বহুমুখী মডেল।","https://chatgpt.com"],
["Claude","Anthropic","টেক্সট","ক্লোজড","লেখা, কোডিং ও দীর্ঘ ডকুমেন্টের কাজে জনপ্রিয়।","https://claude.ai"],
["Gemini","Google","টেক্সট","ক্লোজড","টেক্সট, ছবি ও ভিডিও বোঝে — মাল্টিমোডাল।","https://gemini.google.com"],
["Llama","Meta","টেক্সট","ওপেন","ওপেন-ওয়েট; নিজের মতো চালানো ও কাস্টমাইজ করা যায়।","https://www.llama.com"],
["Mistral","Mistral AI","টেক্সট","ওপেন","ছোট আকারে দ্রুত ও কম খরচের মডেল।","https://chat.mistral.ai"],
["DeepSeek","DeepSeek","টেক্সট","ওপেন","যুক্তি, গণিত ও কোডে কম খরচে আলোচিত।","https://chat.deepseek.com"],
["Qwen","Alibaba","টেক্সট","ওপেন","বহুভাষিক কাজ ও কোডে ভালো।","https://chat.qwen.ai"],
["Stable Diffusion","Stability AI","ছবি","ওপেন","নিজের পিসিতে চালিয়ে ছবি বানানো যায়।","https://stability.ai"],
["FLUX","Black Forest Labs","ছবি","ওপেন","স্পষ্ট ও বিস্তারিত ছবি তৈরির মডেল।","https://huggingface.co/black-forest-labs"],
["Midjourney","Midjourney","ছবি","ক্লোজড","শিল্পসুলভ ডিজাইন ও ছবির জন্য জনপ্রিয়।","https://www.midjourney.com"],
["Whisper","OpenAI","অডিও","ওপেন","কথা থেকে লেখা (ট্রান্সক্রিপশন) বের করে।","https://github.com/openai/whisper"],
["ElevenLabs","ElevenLabs","অডিও","ক্লোজড","লেখা থেকে স্বাভাবিক কণ্ঠস্বর তৈরি।","https://elevenlabs.io"]];
const APPS=[
["ChatGPT","OpenAI","চ্যাট","অ্যাপ","প্রশ্ন, লেখা, কোড ও ছবি — সব এক চ্যাটে।","https://chatgpt.com"],
["Claude","Anthropic","চ্যাট","অ্যাপ","ওয়েব, মোবাইল ও ডেস্কটপে এআই সহকারী।","https://claude.ai"],
["Gemini","Google","চ্যাট","অ্যাপ","Google সেবার সাথে যুক্ত এআই সহকারী।","https://gemini.google.com"],
["Perplexity","Perplexity","সার্চ","অ্যাপ","উৎসসহ উত্তর দেওয়া এআই সার্চ।","https://www.perplexity.ai"],
["Copilot","Microsoft","চ্যাট","অ্যাপ","Microsoft-এর এআই সহকারী।","https://copilot.microsoft.com"],
["NotebookLM","Google","পড়াশোনা","অ্যাপ","নিজের ডকুমেন্ট থেকে সারাংশ ও প্রশ্নোত্তর।","https://notebooklm.google.com"],
["Cursor","Cursor","কোডিং","অ্যাপ","এআই-সহ কোড এডিটর।","https://cursor.com"],
["Hugging Face","Hugging Face","হাব","অ্যাপ","হাজার হাজার ওপেন মডেল ও ডেমো খুঁজুন।","https://huggingface.co"],
["Ollama","Ollama","লোকাল","অ্যাপ","ওপেন মডেল নিজের কম্পিউটারে চালান।","https://ollama.com"],
["LM Studio","LM Studio","লোকাল","অ্যাপ","সহজ ইন্টারফেসে লোকাল মডেল চালান।","https://lmstudio.ai"],
["Suno","Suno","অডিও","অ্যাপ","লিখে গান তৈরি করার এআই।","https://suno.com"],
["Runway","Runway","ভিডিও","অ্যাপ","এআই দিয়ে ভিডিও তৈরি ও এডিট।","https://runwayml.com"]];
const $=i=>document.getElementById(i);let tab="সব";
function card(m,app){return '<div class="card"><h3>'+m[0]+'</h3><div class="by">'+m[1]+'</div><div class="tags"><span class="a">'+m[2]+'</span><span class="'+(m[3]=="ওপেন"?"o":"")+'">'+m[3]+'</span></div><p>'+m[4]+'</p><a class="go" href="'+m[5]+'" target="_blank" rel="noopener noreferrer">'+(app?'অ্যাপ খুলুন ↗':'এখনই খুলুন ↗')+'</a></div>'}
function tabs(){
 $('tabs').innerHTML=["সব","মডেল","অ্যাপ"].map(t=>'<button class="tab '+(t==tab?'on':'')+'" data-t="'+t+'">'+t+'</button>').join('');
}
function draw(){
 const q=$('q').value.trim().toLowerCase();
 const f=a=>a.filter(m=>!q||m.slice(0,5).join(' ').toLowerCase().includes(q));
 let h='';
 const sec=(title,arr,app)=>arr.length?'<h2>'+title+' ('+arr.length+')</h2><div class="grid">'+arr.map(m=>card(m,app)).join('')+'</div>':'';
 if(tab!="অ্যাপ")h+=sec('এআই মডেল',f(MODELS),false);
 if(tab!="মডেল")h+=sec('এআই অ্যাপ',f(APPS),true);
 $('out').innerHTML=h||'<div class="empty">কিছু পাওয়া যায়নি। অন্য শব্দ লিখুন।</div>';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;tabs();draw()}});
$('q').addEventListener('input',draw);
tabs();draw();

// PWA: সার্ভিস ওয়ার্কার চালু
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(err => console.error("Service worker registration failed:", err));
  });
}

// ব্রাউজার সমর্থন করলে ইনস্টল বাটন দেখাও
let installPrompt = null;
const installBtn = $("installBtn");
const installHelp = $("installHelp");
window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  installPrompt = event;
  installBtn.hidden = false;
  installHelp.textContent = "এই ডিভাইসে অ্যাপ হিসেবে ইনস্টল করা যাবে।";
});
installBtn.addEventListener("click", async () => {
  if (!installPrompt) {
    installHelp.textContent = "ব্রাউজারের মেনু থেকে “Install app” বা “Add to Home Screen” নির্বাচন করুন।";
    return;
  }
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  installBtn.hidden = true;
});
window.addEventListener("appinstalled", () => {
  installBtn.hidden = true;
  installHelp.textContent = "AI Model Hub ইনস্টল হয়েছে।";
});
</script></body></html>
